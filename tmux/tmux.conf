set -g status on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# plugins (prefix + I to install)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# auto-save every 15 min and auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# also save whenever a client detaches or its terminal window closes
set-hook -g client-detached 'run-shell -b "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'

run '~/.config/tmux/plugins/tpm/tpm'
